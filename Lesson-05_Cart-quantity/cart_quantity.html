</head>
<body>
       <!-- Cart Quantity Can't be more than 10 -->
    <button onclick="
        console.log('Cart Quantity :', cartQuantity)"> Show Quantity</button>

    <button onclick="
        if(cartQuantity < 10){
            cartQuantity = cartQuantity+1
            console.log('Cart Quantity : ',cartQuantity );
        }else{
            alert('Cart is full');
        }
        ">  Add to Cart</button>

    <button onclick="
        if(cartQuantity < 9){
            cartQuantity = cartQuantity+2;
            console.log('Cart Quantity : ',cartQuantity );
        }
        else if(cartQuantity < 10){
            cartQuantity = cartQuantity+1
            console.log('Cart Quantity : ',cartQuantity );
        }else{

        } "> 
        +2 </button>
        
    <button onclick="
        if(cartQuantity < 8){
            cartQuantity = cartQuantity+3;
            console.log('Cart Quantity : ',cartQuantity );

            console.log('Cart Quantity :', cartQuantity)
        }
        else if(cartQuantity < 10){
            cartQuantity = cartQuantity+1
            console.log('Cart Quantity : ',cartQuantity );

            alert('Cart is full');

    <button onclick="
        cartQuantity = 0;

        console.log('Cart Quantity :', cartQuantity);"> Reset Cart </button>
