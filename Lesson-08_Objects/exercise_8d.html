    <script>
       
            const product1 = {
                name: 'iphone',
                price: 1299
            };

            const product2 ={
                name: 'samsung',

            }

        comparePrice(product1, product2);

        function comparePrice(product_1, product_2){

            let result = ' ';

            } else{

            }
            console.log(result, 'is cheaper');
        }
