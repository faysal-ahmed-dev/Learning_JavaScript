
<!DOCTYPE html>

<body>
    

    <script>
        const product = {
            name: 'basketball',
            price: `${2095} Cents`,
        }
        console.log(product);
        // increase price by 500cents
        product.price = `${2095 + 500} cents`;
        console.log(product);

        // add property delivery-time using bracket notation
        product['delivery-time'] = '3 days';
        console.log(product);


    </script>
</body>
