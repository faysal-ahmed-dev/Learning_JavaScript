
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Length Converter</title>
</head>
<body>
    
    <script>

        convertLength(50, 'km', 'km');

        function convertLength(length, from, to){
            const lengthValue = length;
            let result=0;

            if(from === to){
                console.log(`${lengthValue} ${from}`)
            }
            else if(from == 'miles' && to === 'km'){
                result = lengthValue*1.6;
                console.log(`${result} km`);
            }
            else if(from === 'km' && to === 'miles'){
                result = lengthValue*0.625;
                console.log(`${result} miles`);
            }
            else{
                console.log('Invlalid');
            }
        }
        
    </script>
</body>
</html>
