<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array</title>
</head>
<body>
    

    <script>

        const arr = [12, 45, 34, 77, 80];
        console.log(arr);    
        
        console.log('Length: ', arr.length);
        
        
        console.log(arr[0]);

        arr.push(100);
        console.log(arr);
        
        arr.pop();
        console.log(arr);
        
        arr.splice(1, 2);
        console.log(arr);

        console.log('Length: ', arr.length);

        
        
        
        
        
    </script>
</body>
</html>
