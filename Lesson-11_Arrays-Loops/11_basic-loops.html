<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop</title>
    <link rel="stylesheet" href="11_to-do-list.css">
</head>
<body>
    

    <script>

        const arr = [3, 5, 2, 6, 7];
        let sum = 0;

        for(let i=0; i<arr.length; i++){
            sum += arr[i];
        }

        console.log(sum);

        // duplicate the array with each number doubled

        const arr2 = [1, 2, 3];
        let brr2 = [];

        for(let i = 0; i < arr2.length; i++){
            brr2[i] = arr2[i]*2;
        }
        
        console.log(brr2);
        

    </script>
</body>
</html>
